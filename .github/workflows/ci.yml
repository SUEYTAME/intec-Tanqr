name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  backend:
    name: Backend - build y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: backend/global.json
      - name: Fuente TTF para los PDF (PDFsharp no incluye fuentes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Restaurar dependencias
        run: dotnet restore
      - name: Compilar
        run: dotnet build --configuration Release --no-restore
      - name: Ejecutar pruebas
        run: dotnet test --configuration Release --no-build --no-restore
      - name: Barreras y rollback del despliegue (VM simulada aislada)
        run: |
          docker run --rm -e TANQR_DEPLOY_TEST_CONTAINER=1 \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            bash:5.3@sha256:61962062d969cb46dfc2bad061d36342406fa485f64f246aa7e95693ca07df1f \
            bash -c 'apk add --no-cache util-linux python3 coreutils >/dev/null && bash scripts/test-azure-deploy.sh'

  frontend:
    name: Frontend - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del lockfile
        run: npm ci
      - name: Compilar
        run: npm run build
      - name: Revisar código
        run: npm run lint

  browser:
    name: Navegador - escritorio y móvil
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet build
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: PostgreSQL, API e interfaz reales
        run: bash scripts/ci-e2e.sh

  container:
    name: Contenedor - publicar en GHCR
    needs: [backend, frontend, browser]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/fase-2-producto'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      source-sha256: ${{ steps.package.outputs.source-sha256 }}
      image-sha256: ${{ steps.package.outputs.image-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Construir y publicar la revisión probada
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$image:sha-$GITHUB_SHA" .
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$image:sha-$GITHUB_SHA"
          docker tag "$image:sha-$GITHUB_SHA" "$image:fase-2-producto"
          docker push "$image:fase-2-producto"
          package="users/$GITHUB_REPOSITORY_OWNER/packages/container/${GITHUB_REPOSITORY#*/}"
          visibility=$(gh api "$package" --jq '.visibility')
          test "$visibility" = private
          gh api "$package" --jq '{visibility: .visibility, html_url: .html_url}'
          printf 'Imagen publicada: `%s:sha-%s`\n' "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Azure OIDC (sin contraseña)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Transferir imagen exacta y código al Blob privado
        id: package
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          local_image="intec-combustible:0.4.0-${GITHUB_SHA:0:7}"
          docker tag "$image" "$local_image"
          docker save "$local_image" | gzip -1 > image.tar.gz
          git archive --format=tar.gz -o source.tar.gz "$GITHUB_SHA"
          source_hash=$(sha256sum source.tar.gz | cut -d' ' -f1)
          image_hash=$(sha256sum image.tar.gz | cut -d' ' -f1)
          az storage blob upload --subscription "$AZURE_SUBSCRIPTION_ID" --auth-mode login \
            --account-name stintecfueldevb805 -c deployments -n "src-${GITHUB_SHA:0:7}.tar.gz" \
            -f source.tar.gz --overwrite --only-show-errors -o none
          az storage blob upload --subscription "$AZURE_SUBSCRIPTION_ID" --auth-mode login \
            --account-name stintecfueldevb805 -c deployments -n "image-$GITHUB_SHA.tar.gz" \
            -f image.tar.gz --overwrite --only-show-errors -o none
          echo "source-sha256=$source_hash" >> "$GITHUB_OUTPUT"
          echo "image-sha256=$image_hash" >> "$GITHUB_OUTPUT"

  deploy:
    name: Azure - respaldo y despliegue secuencial
    needs: [container]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/fase-2-producto'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Azure OIDC (sin contraseña)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Actualizar VM y comprobar revisión/salud
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          DEPLOY_REVISION: ${{ github.sha }}
          SRC_SHA256: ${{ needs.container.outputs.source-sha256 }}
          IMAGE_SHA256: ${{ needs.container.outputs.image-sha256 }}
        run: bash scripts/ci-azure-deploy.sh
